<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
	<title>{% block title %}{% endblock %}</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'start/vendor/bootstrap/css/bootstrap.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'start/fonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'start/vendor/animate/animate.css' %}">
<!--===============================================================================================-->
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{% static 'start/css/reg/util.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'start/css/reg/main.css' %}">
	<link rel="shortcut icon" href="{% static 'start/image/logo.svg' %}" />
<!--===============================================================================================-->
</head>
<body>
	{% block content %}{% endblock %}
<!--===============================================================================================-->
	<script src="{% static 'start/vendor/jquery/jquery-3.2.1.min.js' %}"></script>
<!--===============================================================================================-->
	<script src="{% static 'start/vendor/bootstrap/js/popper.js' %}"></script>
	<script src="{% static 'start/vendor/bootstrap/js/bootstrap.min.js' %}"></script>
<!--===============================================================================================-->

<!--===============================================================================================-->
	<script src="{% static 'start/vendor/tilt/tilt.jquery.min.js' %}"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>
<!--===============================================================================================-->
</body>
</html>
