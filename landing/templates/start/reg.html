{% extends "auth_base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
{% load static %}
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="{% static 'start/image/lock.png' %}" alt="IMG">
				</div>

				<form method="POST" class="login100-form validate-form">
					<span class="login100-form-title">
						Регистрация аккаунта
					</span>
					{{ form.errors }}
                    {% csrf_token %}
					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="name" name="username" placeholder="имя">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">

						<select style="border:none" class="input100" name="group" id="exampleFormControlSelect3">
    <option value="" disabled selected>Группа</option>
    {% for group in groups %}
    <option value="{{ group.name }}">{{ group.name }}</option>
    {% endfor %}
</select>
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-users" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="forname" name="password1" placeholder="пароль">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>

                    <div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="password2" placeholder="повтор пароля">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>

					<div class="container-login100-form-btn">
						<button type="submit" class="login100-form-btn">
							Зарегистрироваться
						</button>
					</div>


					<div class="text-center p-t-136">
						<a class="txt2" href="{% url 'login' %}">
							Войти в аккаунт
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>
{% endblock %}
