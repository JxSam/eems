{% extends "auth_base.html" %}
{% block title %}Авторизация{% endblock %}
{% block content %}
{% load static %}
<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="{% static 'start/image/lock.png' %}" alt="IMG">
				</div>
				<form class="login100-form validate-form" method="POST">
					<span class="login100-form-title">
						Войдите в аккаунт
					</span>
                    {{ form.errors }}
					{% csrf_token %}
                    <div class="wrap-input100 validate-input" data-validate = "Valid email is required: ex@abc.xyz">
						<input class="input100" type="username" name="username" placeholder="Имя" required="">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user" aria-hidden="true"></i>
						</span>
					</div>
					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" name="password" placeholder="пароль" required="">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>
					<div class="container-login100-form-btn">
						<input type="submit" value="Войти" class="login100-form-btn"></input>
					</div>

					<div class="text-center p-t-12">
						<span class="txt1">
							Забыли
						</span>
						<a class="txt2" href="#">
							Имя / Пароль?
						</a>
					</div>

					<div class="text-center p-t-136">
						<a class="txt2" href="{% url 'reg' %}">
							Создать аккаунт
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
						</a>
					</div>
				</form>
			</div>
		</div>
	</div>
{% endblock %}
